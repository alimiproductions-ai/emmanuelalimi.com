name: Ranger les œuvres

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ranger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/migration.py
      - run: |
          git config user.name "alimiproductions-ai"
          git config user.email "alimiproductions@gmail.com"
          git add oeuvres site archives
          git commit -m "Œuvres rangées en dossiers depuis l'ancien site" || echo "Rien à enregistrer"
          git push
