# Interface d'administration Pages CMS (https://app.pagescms.org)
# Médias : un dossier par série. Le nom du fichier donne l'ordre et le titre,
# par exemple « 13 Mon tableau.jpg ».
# Ne pas changer « input » / « output » : ce sont les dossiers où sont rangées les images.
# Pour renommer une série, changer seulement « label » ici et « Nom affiché » dans Séries.
media:
  - name: respire
    label: "Œuvres · Respire"
    input: oeuvres/respire
    output: oeuvres/respire
    categories: [image]
  - name: portraits
    label: "Œuvres · Portraits"
    input: oeuvres/portraits
    output: oeuvres/portraits
    categories: [image]
  - name: spiritualite
    label: "Œuvres · Spiritualité"
    input: oeuvres/spiritualite
    output: oeuvres/spiritualite
    categories: [image]
  - name: pop-art
    label: "Œuvres · Pop-Art"
    input: oeuvres/pop-art
    output: oeuvres/pop-art
    categories: [image]
  - name: meouman
    label: "Œuvres · MeOuman"
    input: oeuvres/meouman
    output: oeuvres/meouman
    categories: [image]
  - name: respire-bannieres
    label: "Bannières · Respire"
    input: oeuvres/respire-bannieres
    output: oeuvres/respire-bannieres
    categories: [image]
  - name: graphic-design
    label: "Graphic design"
    input: oeuvres/graphic-design
    output: oeuvres/graphic-design
    categories: [image]
  - name: atelier
    label: "Accueil · Wonders"
    input: oeuvres/atelier
    output: oeuvres/atelier
    categories: [image]
  - name: live-painting
    label: "Événements · Live painting"
    input: oeuvres/live-painting
    output: oeuvres/live-painting
    categories: [image]
  - name: boutique
    label: "Boutique · photos des prints"
    input: boutique
    output: boutique
    categories: [image]
  - name: site
    label: "Images du site (logo, accueil, portrait, favicon)"
    input: site
    output: site
    categories: [image]

content:
  - name: series
    label: Séries
    type: file
    path: contenu.json
    format: json
    fields:
      - name: series
        label: Séries (dans l'ordre d'affichage)
        type: object
        list: true
        fields:
          - name: nom
            label: Nom affiché
            type: string
            required: true
          - name: dossier
            label: Dossier des images (dans oeuvres/)
            type: string
            required: true
          - name: code
            label: Code catalogue (3 lettres)
            type: string
          - name: intro
            label: Texte de présentation
            type: text
          - name: couverture
            label: Fichier de couverture (nom exact, ex. 01 Baba Sali.png)
            type: string
          - name: bannieres
            label: Dossier des bannières (facultatif)
            type: string
  - name: boutique
    label: Boutique
    type: file
    path: boutique.json
    format: json
    fields:
      - name: titre
        label: Titre de la page
        type: string
      - name: intro
        label: Texte d'introduction
        type: text
      - name: points
        label: Points forts (petites étiquettes sous le titre)
        type: string
        list: true
      - name: format_encadre
        label: Description de l'option « Encadré »
        type: string
      - name: format_print
        label: Description de l'option « Print seul »
        type: string
      - name: prints
        label: Prints (dans l'ordre d'affichage)
        type: object
        list: true
        fields:
          - name: titre
            label: Titre
            type: string
            required: true
          - name: image
            label: Photo (un print sans photo n'est pas affiché)
            type: image
            options:
              media: boutique
          - name: annee
            label: Année
            type: string
          - name: texte
            label: Description courte
            type: text
          - name: prix_encadre
            label: Prix encadré en ₪, livraison incluse (0 = option non proposée)
            type: number
          - name: lien_encadre
            label: Lien de paiement encadré (PayPal). Vide = commande par e-mail
            type: string
          - name: prix_print
            label: Prix print seul en ₪, livraison incluse (0 = option non proposée)
            type: number
          - name: lien_print
            label: Lien de paiement print seul (PayPal). Vide = commande par e-mail
            type: string
          - name: statut
            label: Statut
            type: select
            options:
              values:
                - name: disponible
                  label: Disponible
                - name: precommande
                  label: Précommande
                - name: epuise
                  label: Épuisé
                - name: masque
                  label: Masqué
          - name: original
            label: L'original est à vendre (bouton « Acquérir l'original »)
            type: boolean
          - name: edition
            label: Nombre d'exemplaires de l'édition (0 = non limitée)
            type: number
      - name: originaux
        label: Texte de la partie « Œuvres originales »
        type: text
      - name: infos
        label: Informations pratiques (bas de page)
        type: object
        list: true
        fields:
          - name: titre
            label: Titre
            type: string
          - name: texte
            label: Texte
            type: text
