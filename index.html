<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emmanuel Alimi</title>
<meta name="description" content="Galerie en ligne d'Emmanuel Alimi : Respire Collection, portraits, spiritualité, pop-art, Breslev. Œuvres originales, commandes personnalisées, live painting et caricature.">
<meta property="og:title" content="Emmanuel Alimi">
<meta property="og:description" content="Offrez-vous de l'art. Œuvres originales et commandes personnalisées.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: white gallery wall, works hung edge to edge; one red heart as the only accent (from the artist's own mark). */
:root{
  --wall:#fbfbf9; --panel:#f1f1ee; --ink:#141413; --muted:#6b6b66; --line:#dcdcd6;
  --heart:#e0261c; --heart-ink:#ffffff;
  --display:"Syne","Helvetica Neue",Arial,sans-serif;
  --body:"Karla","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gutter:clamp(16px,4vw,48px);
  --sig-filter:none; --mat:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#121211; --panel:#1c1c1a; --ink:#f2f2ee; --muted:#9a9a93; --line:#2e2e2b;
  --heart:#ff4a3d; --heart-ink:#121211; --sig-filter:invert(1); --mat:#f4f4f1; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#121211; --panel:#1c1c1a; --ink:#f2f2ee; --muted:#9a9a93; --line:#2e2e2b;
  --heart:#ff4a3d; --heart-ink:#121211; --sig-filter:invert(1); --mat:#f4f4f1; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--wall);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--heart);outline-offset:3px}
.wrap{padding-inline:var(--gutter);max-width:1440px;margin-inline:auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--wall) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:72px}
.sig{display:flex;align-items:center;gap:12px;text-decoration:none}
.sig img{height:46px;width:auto;filter:var(--sig-filter)}
.sig span{font:800 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase}
.nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.nav a{font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:10px 12px;border-radius:999px;color:var(--muted)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--panel)}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);font:500 13px var(--mono);padding:10px 14px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
@media (max-width:860px){
  .menu-btn{display:block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--wall);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:8px var(--gutter) 16px}
  .nav.open{display:flex}
  .nav a{padding:14px 4px;border-radius:0;border-bottom:1px solid var(--line)}
}

/* type */
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.eyebrow{font:500 12px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:clamp(18px,2vw,21px);max-width:62ch;color:var(--muted)}
.heart{color:var(--heart)}

/* hero */
.hero{padding-block:clamp(28px,5vw,64px) 0}
.hero h1{font-weight:800;font-size:clamp(48px,11vw,168px);line-height:.86;letter-spacing:-.035em;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--heart)}
.hero-row{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-top:20px}
.hero-row p{margin:0}
.hero-banner{margin-top:clamp(24px,4vw,48px);aspect-ratio:2.83/1;width:100%;background:var(--mat);overflow:hidden}
.hero-banner img{width:100%;height:100%;object-fit:cover}
@media (max-width:640px){.hero-row{grid-template-columns:1fr}.hero-banner{aspect-ratio:16/10}}

.btn{display:inline-flex;align-items:center;gap:10px;font:500 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:16px 22px;border-radius:999px;background:var(--ink);color:var(--wall);border:0;cursor:pointer}
.btn:hover{background:var(--heart);color:var(--heart-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{border-color:var(--heart);background:var(--heart);color:var(--heart-ink)}

/* sections */
section{padding-block:clamp(48px,8vw,112px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(24px,4vw,40px);border-bottom:1px solid var(--ink);padding-bottom:16px}
.sec-head h2{font-size:clamp(32px,5vw,64px);font-weight:800;letter-spacing:-.02em;line-height:.95;text-transform:uppercase}

/* collection index */
.colls{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(16px,2vw,28px)}
.coll{text-decoration:none;display:grid;gap:14px}
.coll .frame{aspect-ratio:4/5;background:var(--mat);overflow:hidden}
.coll img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.coll:hover img{transform:scale(1.04)}
.coll .meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.coll h3{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
.coll .count{font:400 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* gallery */
.masonry{columns:4 260px;column-gap:clamp(12px,1.6vw,22px)}
.work{break-inside:avoid;margin:0 0 clamp(12px,1.6vw,22px);cursor:zoom-in;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit;display:block}
.work .frame{background:var(--mat);overflow:hidden}
.work img{width:100%;height:auto;transition:opacity .3s, transform .6s cubic-bezier(.2,.7,.2,1)}
.work:hover img{transform:scale(1.02)}
.work figcaption{display:flex;justify-content:space-between;gap:12px;padding-top:8px;font-size:14px}
.work figcaption .cat{font:400 11px var(--mono);color:var(--muted);letter-spacing:.06em;white-space:nowrap;font-variant-numeric:tabular-nums}
.wide-strip{display:grid;gap:clamp(12px,1.6vw,22px);margin-bottom:clamp(32px,5vw,64px)}
.wide-strip .work{margin:0}

.page-head{padding-block:clamp(40px,6vw,88px) clamp(24px,3vw,40px)}
.page-head h1{font-size:clamp(44px,9vw,128px);font-weight:800;letter-spacing:-.035em;line-height:.88;text-transform:uppercase}
.page-head .lede{margin-top:20px}
.page-head .crumbs{margin-bottom:18px}
.page-head .crumbs a{text-decoration:none}
.page-head .crumbs a:hover{color:var(--heart)}

/* feature split */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center}
.split img{width:100%;height:auto;background:var(--mat)}
@media (max-width:800px){.split{grid-template-columns:1fr}}

/* si tu crois */
.symbol{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,56px);padding-block:clamp(28px,4vw,48px);border-top:1px solid var(--line);align-items:start}
.symbol h3{font-size:clamp(26px,3.2vw,40px);font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
.symbol p{max-width:60ch;margin:12px 0 0}
.symbol .n{font:500 12px var(--mono);color:var(--heart);letter-spacing:.1em}
.symbol img{width:100%;height:auto;background:var(--mat)}
@media (max-width:760px){.symbol{grid-template-columns:1fr}}
blockquote{margin:0;font:700 clamp(26px,4vw,48px)/1.1 var(--display);letter-spacing:-.01em;max-width:24ch}
blockquote cite{display:block;margin-top:16px;font:400 13px var(--mono);font-style:normal;color:var(--muted);letter-spacing:.06em}

/* events */
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(16px,2vw,28px)}
.event{display:grid;gap:16px;text-decoration:none}
.event .frame{aspect-ratio:1;overflow:hidden;background:var(--mat)}
.event img{width:100%;height:100%;object-fit:cover}
.event h3{font-size:28px;text-transform:uppercase;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags li{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:8px 12px}

/* shop */
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:clamp(16px,2vw,28px)}
.product{display:grid;gap:12px;align-content:start}
.product .frame{aspect-ratio:1;background:var(--mat);overflow:hidden;position:relative}
.product .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s}
.product .frame img+img{opacity:0}
.product:hover .frame img+img{opacity:1}
.product h3{font:700 18px/1.2 var(--display)}
.price{font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.price s{color:var(--muted);margin-right:8px}
.price .sale{color:var(--heart)}
.soon{padding-block:clamp(56px,10vw,140px);display:grid;gap:24px;justify-items:start}
.soon h1{font-size:clamp(56px,12vw,180px);font-weight:800;line-height:.86;letter-spacing:-.035em;text-transform:uppercase}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,56px) clamp(24px,5vw,72px)}
.contact-head{grid-column:1/-1}
@media (max-width:820px){.contact{grid-template-columns:1fr}}
.contact h2{font-size:clamp(40px,7vw,96px);overflow-wrap:anywhere;font-weight:800;line-height:.9;text-transform:uppercase;letter-spacing:-.03em}
.mail-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px}
.mail{font:500 clamp(16px,2vw,20px) var(--mono);user-select:all;word-break:break-all}
.copy{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer}
.socials{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap}
.socials a{font:500 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-underline-offset:4px}
form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);padding:10px 0;border-radius:0}
.field textarea{min-height:140px;resize:vertical}
.field select{appearance:none;background:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.form-note{font-size:14px;color:var(--muted);margin:0}
.ok{font:500 14px var(--mono);color:var(--heart)}

/* bio */
.bio{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(24px,5vw,80px);align-items:start}
.bio p{max-width:62ch}
.bio .portrait{background:var(--mat)}
@media (max-width:800px){.bio{grid-template-columns:1fr}}

/* footer */
footer{border-top:1px solid var(--line);padding-block:32px;margin-top:clamp(40px,6vw,80px)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;font:400 12px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--wall) 97%,transparent);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gutter) calc(env(safe-area-inset-bottom,0px) + 16px)}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px}
.lb-stage{display:grid;place-items:center;min-height:0}
.lb-stage img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.lb-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px}
.lb button{background:none;border:1px solid var(--line);color:var(--ink);font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-radius:999px;cursor:pointer}
.lb button:hover{border-color:var(--heart);color:var(--heart)}
.lb-title{font:700 18px var(--display)}

.reveal{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
</style>
</head>

function workFig(list, i, code){
  const [id,title,w,h] = list[i];
  const ratio = (w&&h)?` width="${w}" height="${h}"`:"";
  const cat = code?`${code}-${String(i+1).padStart(2,"0")}`:"";
  return `<button class="work" data-i="${i}"><figure style="margin:0"><div class="frame"><img loading="lazy" src="${src(id,800)}"${ratio} alt="${esc(title||"Œuvre d'Emmanuel Alimi")}"></div>
  ${(title||cat)?`<figcaption><span>${esc(title)}</span><span class="cat">${cat}</span></figcaption>`:""}</figure></button>`;
}
function masonry(list, code){
  return `<div class="masonry" data-lb>${list.map((_,i)=>workFig(list,i,code)).join("")}</div>`;
}
function head(eyebrow, title, lede, crumb){
  return `<div class="wrap page-head reveal">${crumb?`<p class="eyebrow crumbs"><a href="#collections">Collections</a> / ${esc(crumb)}</p>`:`<p class="eyebrow">${esc(eyebrow)}</p>`}
  <h1>${title}</h1>${lede?`<p class="lede">${esc(lede)}</p>`:""}</div>`;
}

function render(){
  const route = (location.hash.slice(1)||"accueil");
  const coll = COLLECTIONS.find(c=>c.slug===route);
  let html;
  if (coll){
    html = head("","" ,"",coll.name).replace("<h1></h1>",`<h1>${esc(coll.name)}</h1><p class="lede">${esc(coll.intro)}</p>`);
    if (coll.banners) html += `<div class="wrap"><div class="wide-strip" data-lb>${coll.banners.slice(0,3).map((b,i)=>`<button class="work" data-i="${i}"><div class="frame"><img loading="lazy" src="${src(b[0],1600)}" alt="${esc(b[1])}"></div><figcaption><span>${esc(b[1])}</span><span class="cat">Bannière</span></figcaption></button>`).join("")}</div></div>`;
    html += `<div class="wrap">${masonry(coll.works, coll.code)}</div>`;
    const others = COLLECTIONS.filter(c=>c!==coll);
    html += `<section class="wrap"><div class="sec-head"><h2>Autres séries</h2></div><div class="colls">${others.map(c=>`<a class="coll" href="#${c.slug}"><div class="frame"><img loading="lazy" src="${src(c.cover,800)}" alt="${esc(c.name)}"></div><div class="meta"><h3>${esc(c.name)}</h3><span class="count">${String(c.works.length).padStart(2,"0")} œuvres</span></div></a>`).join("")}</div></section>`;
    LBSRC = {lists:[coll.banners?coll.banners.slice(0,3).map(b=>[b[0],b[1]]):null, coll.works]};
  } else {
    html = (ROUTES[route]||ROUTES.accueil)();
  }
  app.innerHTML = html;
  document.querySelectorAll(".nav a").forEach(a=>{
    const h=a.getAttribute("href").slice(1);
    const on = h===route || (h==="collections" && !!coll);
    on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current");
  });
  document.getElementById("nav").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  wire(route, coll);
  const pend = sessionSubject; if (pend){ const s=document.getElementById("f-subj"); if(s){ const o=[...s.options].find(o=>o.text===pend)||new Option(pend,pend,true,true); if(!o.parentNode) s.add(o); s.value=o.value; } sessionSubject=null; }
  if (!scrollToContact) window.scrollTo({top:0});
  else { document.getElementById("contact-sec")?.scrollIntoView(); scrollToContact=false; }
}
let LBSRC=null, sessionSubject=null, scrollToContact=false;

function wire(route, coll){
  // lightbox groups: each [data-lb] container is its own sequence
  document.querySelectorAll("[data-lb]").forEach(group=>{
    const items=[...group.querySelectorAll(".work")].map(b=>{const im=b.querySelector("img");return {src:im.currentSrc||im.src, alt:im.alt, cap:b.querySelector("figcaption span")?.textContent||""};});
    group.querySelectorAll(".work").forEach((b,i)=>b.addEventListener("click",()=>openLB(items.map(x=>({...x,src:x.src.replace(/w_\d+,h_\d+/,"w_1800,h_1800").replace(/-800\.webp$/,"-1600.webp")})),i)));
  });
  document.querySelectorAll("[data-subject]").forEach(a=>a.addEventListener("click",()=>{sessionSubject=a.dataset.subject;}));
  const copy=document.getElementById("copyMail");
  if (copy) copy.addEventListener("click",()=>{
    const done=()=>{copy.textContent="Copié";setTimeout(()=>copy.textContent="Copier",1600);};
    try{ navigator.clipboard.writeText(EMAIL).then(done,()=>selectMail()); }catch(e){ selectMail(); }
  });
  const f=document.getElementById("cform");
  if (f) f.addEventListener("submit",e=>{
    e.preventDefault();
    const ok=document.getElementById("fok");
    if(!f.reportValidity()) return;
    const d=new FormData(f);
    const body=`${d.get("message")}\n\n${d.get("name")} <${d.get("email")}>`;
    location.href=`mailto:${EMAIL}?subject=${encodeURIComponent(d.get("subject")+" (site emmanuelalimi.com)")}&body=${encodeURIComponent(body)}`;
    ok.hidden=false; ok.textContent="Votre messagerie va s'ouvrir avec le message prêt à envoyer.";
  });
}
function selectMail(){const r=document.createRange();r.selectNodeContents(document.getElementById("mailtxt"));const s=getSelection();s.removeAllRanges();s.addRange(r);}

/* lightbox */
const lb=document.getElementById("lb"), lbImg=document.getElementById("lbImg");
let cur=[], idx=0, lastFocus=null;
function openLB(list,i){ cur=list; idx=i; lastFocus=document.activeElement; lb.hidden=false; document.body.style.overflow="hidden"; show(); document.getElementById("lbClose").focus(); }
function show(){ const it=cur[idx]; lbImg.src=it.src; lbImg.alt=it.alt; document.getElementById("lbTitle").textContent=it.cap||""; document.getElementById("lbCount").textContent=`${String(idx+1).padStart(2,"0")} / ${String(cur.length).padStart(2,"0")}`; }
function closeLB(){ lb.hidden=true; document.body.style.overflow=""; lastFocus&&lastFocus.focus(); }
document.getElementById("lbClose").onclick=closeLB;
document.getElementById("lbPrev").onclick=()=>{idx=(idx-1+cur.length)%cur.length;show();};
document.getElementById("lbNext").onclick=()=>{idx=(idx+1)%cur.length;show();};
lb.addEventListener("click",e=>{ if(e.target===lb||e.target.classList.contains("lb-stage")) closeLB(); });
document.addEventListener("keydown",e=>{ if(lb.hidden) return; if(e.key==="Escape")closeLB(); if(e.key==="ArrowLeft")document.getElementById("lbPrev").click(); if(e.key==="ArrowRight")document.getElementById("lbNext").click(); });
let tx=null; lb.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
lb.addEventListener("touchend",e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50)(dx<0?document.getElementById("lbNext"):document.getElementById("lbPrev")).click(); tx=null; });

/* menu, routing */
document.getElementById("menuBtn").onclick=e=>{ const n=document.getElementById("nav"); n.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded",n.classList.contains("open")); };
document.getElementById("sigimg").src=src(LOGO,200);
document.getElementById("yr").textContent=new Date().getFullYear();
window.addEventListener("hashchange",()=>{ if(location.hash==="#contact" && sessionSubject && document.getElementById("cform")){ scrollToContact=true; } render(); });
render();
</script>
