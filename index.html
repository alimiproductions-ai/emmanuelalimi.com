<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emmanuel Alimi</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Galerie en ligne d'Emmanuel Alimi : Respire Collection, portraits, spiritualité, pop-art, Breslev. Œuvres originales, commandes personnalisées, live painting et caricature.">
<meta property="og:title" content="Emmanuel Alimi">
<meta property="og:description" content="Offrez-vous de l'art. Œuvres originales et commandes personnalisées.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: white gallery wall, works hung edge to edge; one red heart as the only accent (from the artist's own mark). */
:root{
  --wall:#fbfbf9; --panel:#f1f1ee; --ink:#141413; --muted:#6b6b66; --line:#dcdcd6;
  --heart:#e0261c; --heart-ink:#ffffff;
  --display:"Syne","Helvetica Neue",Arial,sans-serif;
  --body:"Karla","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gutter:clamp(16px,4vw,48px);
  --sig-filter:none; --mat:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#121211; --panel:#1c1c1a; --ink:#f2f2ee; --muted:#9a9a93; --line:#2e2e2b;
  --heart:#ff4a3d; --heart-ink:#121211; --sig-filter:invert(1); --mat:#f4f4f1; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#121211; --panel:#1c1c1a; --ink:#f2f2ee; --muted:#9a9a93; --line:#2e2e2b;
  --heart:#ff4a3d; --heart-ink:#121211; --sig-filter:invert(1); --mat:#f4f4f1; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--wall);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--heart);outline-offset:3px}
.wrap{padding-inline:var(--gutter);max-width:1440px;margin-inline:auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--wall) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:72px}
.sig{display:flex;align-items:center;gap:12px;text-decoration:none}
.sig img{height:46px;width:auto;filter:var(--sig-filter)}
.sig span{font:800 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase}
.nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.nav a{font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:10px 12px;border-radius:999px;color:var(--muted)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--panel)}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);font:500 13px var(--mono);padding:10px 14px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
@media (max-width:860px){
  .menu-btn{display:block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--wall);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:8px var(--gutter) 16px}
  .nav.open{display:flex}
  .nav a{padding:14px 4px;border-radius:0;border-bottom:1px solid var(--line)}
}

/* type */
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.eyebrow{font:500 12px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:clamp(18px,2vw,21px);max-width:62ch;color:var(--muted)}
.heart{color:var(--heart)}

/* hero */
.hero{padding-block:clamp(28px,5vw,64px) 0}
.hero h1{font-weight:800;font-size:clamp(48px,11vw,168px);line-height:.86;letter-spacing:-.035em;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--heart)}
.hero-row{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-top:20px}
.hero-row p{margin:0}
.hero-banner{margin-top:clamp(24px,4vw,48px);aspect-ratio:2.83/1;width:100%;background:var(--mat);overflow:hidden}
.hero-banner img{width:100%;height:100%;object-fit:cover}
@media (max-width:640px){.hero-row{grid-template-columns:1fr}.hero-banner{aspect-ratio:16/10}}

.btn{display:inline-flex;align-items:center;gap:10px;font:500 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:16px 22px;border-radius:999px;background:var(--ink);color:var(--wall);border:0;cursor:pointer}
.btn:hover{background:var(--heart);color:var(--heart-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{border-color:var(--heart);background:var(--heart);color:var(--heart-ink)}

/* sections */
section{padding-block:clamp(48px,8vw,112px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(24px,4vw,40px);border-bottom:1px solid var(--ink);padding-bottom:16px}
.sec-head h2{font-size:clamp(32px,5vw,64px);font-weight:800;letter-spacing:-.02em;line-height:.95;text-transform:uppercase}

/* collection index */
.colls{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(16px,2vw,28px)}
.coll{text-decoration:none;display:grid;gap:14px}
.coll .frame{aspect-ratio:4/5;background:var(--mat);overflow:hidden}
.coll img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.coll:hover img{transform:scale(1.04)}
.coll .meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.coll h3{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
.coll .count{font:400 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* gallery */
.masonry{columns:4 260px;column-gap:clamp(12px,1.6vw,22px)}
.work{break-inside:avoid;margin:0 0 clamp(12px,1.6vw,22px);cursor:zoom-in;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit;display:block}
.work .frame{background:var(--mat);overflow:hidden}
.work img{width:100%;height:auto;transition:opacity .3s, transform .6s cubic-bezier(.2,.7,.2,1)}
.work:hover img{transform:scale(1.02)}
.work figcaption{display:flex;justify-content:space-between;gap:12px;padding-top:8px;font-size:14px}
.work figcaption .cat{font:400 11px var(--mono);color:var(--muted);letter-spacing:.06em;white-space:nowrap;font-variant-numeric:tabular-nums}
.wide-strip{display:grid;gap:clamp(12px,1.6vw,22px);margin-bottom:clamp(32px,5vw,64px)}
.wide-strip .work{margin:0}

.page-head{padding-block:clamp(40px,6vw,88px) clamp(24px,3vw,40px)}
.page-head h1{font-size:clamp(44px,9vw,128px);font-weight:800;letter-spacing:-.035em;line-height:.88;text-transform:uppercase}
.page-head .lede{margin-top:20px}
.page-head .crumbs{margin-bottom:18px}
.page-head .crumbs a{text-decoration:none}
.page-head .crumbs a:hover{color:var(--heart)}

/* feature split */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center}
.split img{width:100%;height:auto;background:var(--mat)}
@media (max-width:800px){.split{grid-template-columns:1fr}}

/* si tu crois */
.symbol{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,56px);padding-block:clamp(28px,4vw,48px);border-top:1px solid var(--line);align-items:start}
.symbol h3{font-size:clamp(26px,3.2vw,40px);font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
.symbol p{max-width:60ch;margin:12px 0 0}
.symbol .n{font:500 12px var(--mono);color:var(--heart);letter-spacing:.1em}
.symbol img{width:100%;height:auto;background:var(--mat)}
@media (max-width:760px){.symbol{grid-template-columns:1fr}}
blockquote{margin:0;font:700 clamp(26px,4vw,48px)/1.1 var(--display);letter-spacing:-.01em;max-width:24ch}
blockquote cite{display:block;margin-top:16px;font:400 13px var(--mono);font-style:normal;color:var(--muted);letter-spacing:.06em}

/* events */
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(16px,2vw,28px)}
.event{display:grid;gap:16px;text-decoration:none}
.event .frame{aspect-ratio:1;overflow:hidden;background:var(--mat)}
.event img{width:100%;height:100%;object-fit:cover}
.event h3{font-size:28px;text-transform:uppercase;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags li{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:8px 12px}

/* shop */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.prints{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:clamp(32px,4vw,56px) clamp(20px,3vw,40px)}
.print{display:grid;gap:16px;align-content:start;min-width:0}
.print .frame{display:block;aspect-ratio:4/5;width:100%;background:var(--mat);overflow:hidden;position:relative;border:0;padding:0;cursor:zoom-in}
.print .frame img{width:100%;height:100%;object-fit:contain;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.print .frame:hover img{transform:scale(1.02)}
.badge{position:absolute;top:12px;left:12px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--heart);color:var(--heart-ink);padding:8px 11px;border-radius:999px}
.badge.out{background:var(--ink);color:var(--wall)}
.print h3{font-size:clamp(24px,2.4vw,30px);font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.print .sub{font:400 12px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:8px 0 0}
.print p{margin:0}
.print .txt{color:var(--muted);font-size:16px}
.opts{display:grid;gap:8px;border:0;margin:0;padding:0;min-width:0}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.opt:has(input:checked){border-color:var(--ink)}
.opt .l{display:flex;align-items:flex-start;gap:10px;min-width:0}
.opt input{accent-color:var(--heart);margin:5px 0 0;flex:none}
.opt small{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.opt b{font:500 16px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.buy{display:grid;gap:10px;justify-items:start}
.buy .form-note{font-size:13px}
.link-arrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-underline-offset:4px;justify-self:start}
.link-arrow:hover{color:var(--heart)}
.shop-tags{margin-bottom:clamp(28px,4vw,48px)}
.shop-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:24px clamp(24px,4vw,56px)}
.shop-info h3{font-size:18px;text-transform:uppercase;font-weight:700}
.shop-info p{margin:6px 0 0;color:var(--muted);font-size:15px;max-width:44ch}
#checkout{border:0;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--wall);color:var(--ink);border-radius:18px}
#checkout::backdrop{background:rgba(0,0,0,.45)}
.co{display:grid;gap:16px;padding:clamp(20px,4vw,32px)}
.co-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.co-head h2{font-size:clamp(26px,4vw,34px);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:1;margin-top:6px}
.co-head .sub{font:400 12px var(--mono);color:var(--muted);letter-spacing:.04em;margin:8px 0 0}
.co-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-block:1px solid var(--ink);padding:12px 0}
.co-total b{font:500 22px var(--mono);font-variant-numeric:tabular-nums}
.co-pay{min-height:56px}
/* confiance (boutique) */
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 0 clamp(32px,5vw,56px);padding:0;list-style:none}
.trust li{background:var(--wall);display:flex;gap:12px;align-items:flex-start;padding:16px 18px}
.trust b{display:block;font:700 15px/1.25 var(--body)}
.trust span{display:block;font-size:14px;line-height:1.4;color:var(--muted);margin-top:2px}
.trust .ico{color:var(--heart);margin-top:1px}
.reassure{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.reassure li{display:flex;align-items:center;gap:6px}
.reassure .ico{width:15px;height:15px;color:var(--ink)}
.paym{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0;padding:0;list-style:none}
.paym li{font:500 11px/1 var(--mono);letter-spacing:.04em;border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--ink)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:clamp(16px,2vw,28px);margin:0;padding:0;list-style:none;counter-reset:how}
.how li{counter-increment:how;border-top:1px solid var(--ink);padding-top:14px;display:grid;gap:6px}
.how li::before{content:"0" counter(how);font:500 12px var(--mono);color:var(--heart);letter-spacing:.1em}
.how b{font:700 20px/1.15 var(--display);text-transform:uppercase}
.how span{color:var(--muted);font-size:15px}
.faq{display:grid;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 0;font:700 clamp(17px,1.8vw,20px)/1.3 var(--body)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:400 22px/1 var(--mono);color:var(--muted)}
.faq details[open] summary::after{content:"−"}
.faq p{margin:0 0 18px;color:var(--muted);max-width:70ch}
.ask{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;background:var(--panel);border-radius:16px;padding:clamp(18px,3vw,28px)}
.ask p{margin:0;font-size:17px}
.ask .eyebrow{display:block;margin-bottom:4px}
.co-steps{display:flex;gap:8px;margin:0;padding:0;list-style:none;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.co-steps li{flex:1;border-top:3px solid var(--line);padding-top:8px}
.co-steps li.on{border-color:var(--ink);color:var(--ink)}
.co-secure{display:grid;gap:10px;background:var(--panel);border-radius:12px;padding:14px 16px}
.co-secure p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.co-secure p b{color:var(--ink)}
.co-secure .l{display:flex;gap:10px;align-items:flex-start}
.co-secure .ico{color:var(--ink);margin-top:1px}
#coGo{justify-content:center;padding-block:18px}
#coGo .ico{width:16px;height:16px;stroke:currentColor}
.co-lines{margin:0;display:grid;gap:4px}.co-lines div{display:flex;justify-content:space-between;gap:12px;font-size:14px}.co-lines dt{color:var(--muted)}.co-lines dd{margin:0;font:400 14px var(--mono);font-variant-numeric:tabular-nums}
.suivi{display:grid;gap:28px;max-width:760px;padding-bottom:40px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.steps li{border-top:4px solid var(--line);padding-top:10px;display:grid;gap:2px;color:var(--muted)}
.steps li.done{border-color:var(--ink);color:var(--ink)}
.steps li.now{border-color:var(--heart)}
.steps b{font:700 15px var(--display);text-transform:uppercase}
.steps span{font:400 12px var(--mono)}
@media (max-width:560px){.steps{grid-template-columns:1fr 1fr;row-gap:16px}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px;margin:0}
.facts dt{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:4px 0 0}
.note-msg{margin:0;padding:14px 16px;background:var(--panel);border-radius:12px;display:grid;gap:6px}
.soon{padding-block:clamp(56px,10vw,140px);display:grid;gap:24px;justify-items:start}
.soon h1{font-size:clamp(56px,12vw,180px);font-weight:800;line-height:.86;letter-spacing:-.035em;text-transform:uppercase}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,56px) clamp(24px,5vw,72px)}
.contact-head{grid-column:1/-1}
@media (max-width:820px){.contact{grid-template-columns:1fr}}
.contact h2{font-size:clamp(40px,7vw,96px);overflow-wrap:anywhere;font-weight:800;line-height:.9;text-transform:uppercase;letter-spacing:-.03em}
.mail-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px}
.mail{font:500 clamp(16px,2vw,20px) var(--mono);user-select:all;word-break:break-all}
.copy{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer}
.socials{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap}
.socials a{font:500 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-underline-offset:4px}
form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);padding:10px 0;border-radius:0}
.field textarea{min-height:140px;resize:vertical}
.field select{appearance:none;background:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.form-note{font-size:14px;color:var(--muted);margin:0}
.ok{font:500 14px var(--mono);color:var(--heart)}

/* bio */
.bio{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(24px,5vw,80px);align-items:start}
.bio p{max-width:62ch}
.bio .portrait{background:var(--mat)}
@media (max-width:800px){.bio{grid-template-columns:1fr}}

/* footer */
footer{border-top:1px solid var(--line);padding-block:32px;margin-top:clamp(40px,6vw,80px)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;font:400 12px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--wall) 97%,transparent);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gutter) calc(env(safe-area-inset-bottom,0px) + 16px)}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px}
.lb-stage{display:grid;place-items:center;min-height:0}
.lb-stage img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.lb-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px}
.lb button{background:none;border:1px solid var(--line);color:var(--ink);font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-radius:999px;cursor:pointer}
.lb button:hover{border-color:var(--heart);color:var(--heart)}
.lb-title{font:700 18px var(--display)}

.reveal{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">

<dialog id="checkout" aria-label="Commande"></dialog>

<script>
/* Les données (séries, œuvres, images du site) sont insérées par build.py
   à partir des dossiers oeuvres/ et site/ et du fichier contenu.json. */
const DATA = /*__DATA__*/null;
const EMAIL = "alimiproductions@gmail.com";
/* Clé Web3Forms (publique, prévue pour être dans la page) : les messages du formulaire arrivent sur alimiproductions@gmail.com */
const FORM_KEY = "f9f37b1d-99a7-4094-95ad-4af1eb9db5d0";
const D = DATA || {series:[],galeries:{},site:{}};
function src(base, w){ return base ? `${base}-${w>900?1600:800}.webp` : ""; }
const S = D.site;
const LOGO = S.logo;
const COLLECTIONS = D.series.map(s=>({slug:s.dossier, code:s.code, name:s.nom, intro:s.intro, cover:s.couverture, banners:s.bannieres, works:s.works}));
const GRAPHIC = D.galeries["graphic-design"] || [];
const ATELIER = D.galeries["atelier"] || [];
const EVENTS = {
  caricature:{name:"Caricature live",img:S["caricature-live"],text:"Alimi croque vos invités en direct, en quelques minutes chacun. Chacun repart avec son portrait.",tags:["Bar / Bat Mitsva","Anniversaire","Mariage"]},
  painting:{name:"Live painting",img:S["live-painting"],text:"Votre mariage mérite le meilleur. Une toile peinte sur place pendant la soirée, que vous gardez comme mémoire de la journée.",tags:["Mariage","Soirée privée","Entreprise"],
    gallery:D.galeries["live-painting"] || []}
};

/* ---------- boutique ----------
   Sans configuration : les prints viennent de boutique.json (liens PayPal ou commande par e-mail).
   Avec SHOP_CFG rempli : les prints viennent de Supabase, la commande et le paiement se font sur le site,
   et le client suit sa commande sur #suivi/<code>. */
const SHOP_CFG = /*__SHOP__*/null || { url: "", anon: "", paiement: "" };
const LIVE = !!(SHOP_CFG.url && SHOP_CFG.anon && SHOP_CFG.paiement);
// Retour de la page de paiement Grow : ?commande=<code> → page de suivi.
{ const m=location.search.match(/[?&]commande=([a-f0-9]{32})/); if(m) history.replaceState(null,"",location.pathname+"#suivi/"+m[1]);
  else if(/[?&]annule=1/.test(location.search)) history.replaceState(null,"",location.pathname+"#boutique"); }
let B = D.boutique || {prints:[]};
let liveState = LIVE ? "loading" : "off";
const SHOP = () => (B.prints||[]).filter(p=>p.statut!=="masque");
const money = n => `${Number(n).toLocaleString("fr-FR")} ₪`;
const imgOf = (p,w) => p.image_url || src(p.image,w);
function api(action, body){
  return fetch(`${SHOP_CFG.url}/functions/v1/boutique`, {method:"POST", headers:{"Content-Type":"application/json", apikey:SHOP_CFG.anon, Authorization:`Bearer ${SHOP_CFG.anon}`}, body:JSON.stringify({action, ...body})})
    .then(async r=>{ const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||"Le service ne répond pas."); return j; });
}
function loadLive(){
  const h={apikey:SHOP_CFG.anon, Authorization:`Bearer ${SHOP_CFG.anon}`};
  return Promise.all([
    fetch(`${SHOP_CFG.url}/rest/v1/produits?select=*&statut=neq.masque&order=ordre.asc,created_at.asc`,{headers:h}).then(r=>{ if(!r.ok) throw 0; return r.json(); }),
    fetch(`${SHOP_CFG.url}/rest/v1/reglages?select=format_encadre,format_print,delai,zones&id=eq.1`,{headers:h}).then(r=>r.ok?r.json():[]),
  ]).then(([prods,[reg]])=>{
    B = {...B, prints:prods, format_encadre:reg?.format_encadre||B.format_encadre, format_print:reg?.format_print||B.format_print, delai:reg?.delai, zones:Array.isArray(reg?.zones)&&reg.zones.length?reg.zones:null};
    liveState="ready";
  }).catch(()=>{ liveState="error"; });
}
const ZONES=()=>B.zones||[{code:"IL",nom:"Israël",encadre:0,print:0}];
const svg = d => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICO = {
  lock: svg(`<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>`),
  truck: svg(`<path d="M2.5 6.5h11v10h-11zM13.5 10h4l3 3.2v3.3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>`),
  brush: svg(`<path d="M14.5 4.5l5 5-8 8-5-5z"/><path d="M6.5 12.5c-2 .5-3 2-3 4.5 0 1 .2 2 .5 2.5 2.5 0 5-1 5.5-4"/>`),
  track: svg(`<circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.7 2.7L16.5 9.5"/>`),
  chat: svg(`<path d="M4 5.5h16v10H9l-5 4z"/>`),
};
const PAYM = `<ul class="paym" aria-label="Moyens de paiement acceptés"><li>Visa</li><li>Mastercard</li><li>Bit</li><li>Apple Pay</li><li>Google Pay</li></ul>`;
function printOpts(p){
  const o=[];
  if (+p.prix_encadre) o.push({key:"encadre", label:"Encadré", detail:B.format_encadre, price:+p.prix_encadre, link:LIVE?"":(p.lien_encadre||"").trim()});
  if (+p.prix_print) o.push({key:"print", label:"Print seul", detail:B.format_print, price:+p.prix_print, link:LIVE?"":(p.lien_print||"").trim()});
  return o;
}
function printCard(p,i){
  const sold = +p.edition>0 && +p.vendus>=+p.edition;
  const out=p.statut==="epuise"||sold, pre=p.statut==="precommande", opts=printOpts(p);
  const sub=[p.annee, +p.edition?`Édition limitée de ${p.edition} ex.`:""].filter(Boolean).map(esc).join(" · ");
  const dims = p.w&&p.h ? ` width="${p.w}" height="${p.h}"` : "";
  return `<article class="print reveal">
    <button class="frame" type="button" data-zoom="${i}" aria-label="Voir ${esc(p.titre)} en grand"><img loading="lazy" src="${esc(imgOf(p,800))}"${dims} alt="${esc(p.titre)}">${out?`<span class="badge out">Épuisé</span>`:pre?`<span class="badge">Précommande</span>`:""}</button>
    <div><h3>${esc(p.titre)}</h3>${sub?`<p class="sub">${sub}</p>`:""}</div>
    ${p.texte?`<p class="txt">${esc(p.texte)}</p>`:""}
    ${out||!opts.length?`<p class="sub">Cette édition n'est plus disponible.</p>`:`<fieldset class="opts"><legend class="sr">Option pour ${esc(p.titre)}</legend>${opts.map((o,j)=>`<label class="opt"><span class="l"><input type="radio" name="opt-${i}" value="${j}"${j?"":" checked"}><span>${esc(o.label)}${o.detail?`<small>${esc(o.detail)}</small>`:""}</span></span><b>${money(o.price)}</b></label>`).join("")}</fieldset>
    <div class="buy"><a class="btn" data-buy="${i}" href="#contact">${pre?"Précommander":"Commander"}</a><p class="form-note" data-note="${i}"></p>
      ${LIVE?`<ul class="reassure"><li>${ICO.lock}Paiement sécurisé</li><li>${ICO.truck}Livré chez vous</li><li>${ICO.brush}Préparé à l'atelier</li></ul>`:""}</div>`}
    ${p.original?`<a class="link-arrow" href="#contact" data-subject="Acquisition d'une œuvre" data-msg="Bonjour, je suis intéressé(e) par l'œuvre originale « ${esc(p.titre)} ».">Acquérir l'original →</a>`:""}
  </article>`;
}
function wireShop(){
  if (liveState==="loading"){ loadLive().then(()=>{ if((location.hash.slice(1)||"accueil")==="boutique") render(); }); return; }
  const list=SHOP();
  document.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click",()=>openLB(list.map(p=>({src:imgOf(p,1600),alt:p.titre,cap:p.titre})),+b.dataset.zoom)));
  document.querySelectorAll("[data-buy]").forEach(a=>{
    const i=+a.dataset.buy, p=list[i], opts=printOpts(p), note=document.querySelector(`[data-note="${i}"]`);
    const pick=()=>opts[+(document.querySelector(`input[name="opt-${i}"]:checked`)||{value:0}).value];
    const sync=()=>{
      const o=pick();
      if (LIVE && liveState==="ready"){ a.href="#boutique"; a.removeAttribute("target"); note.textContent=`${money(o.price)}, livraison à domicile incluse en Israël.${ZONES().length>1?" Envoi possible à l'étranger (supplément calculé à la commande).":""}`; }
      else if (o.link){ a.href=o.link; a.target="_blank"; a.rel="noopener"; note.textContent=`${money(o.price)}, livraison incluse. Paiement sécurisé par carte, Apple Pay ou PayPal.`; }
      else { a.href="#contact"; a.removeAttribute("target"); note.textContent=`${money(o.price)}, livraison incluse. Vous recevez la confirmation et le lien de paiement par e-mail.`; }
    };
    document.querySelectorAll(`input[name="opt-${i}"]`).forEach(r=>r.addEventListener("change",sync));
    a.addEventListener("click",e=>{
      const o=pick();
      if (LIVE && liveState==="ready"){ e.preventDefault(); openCheckout(p,o); return; }
      if (o.link) return;
      sessionSubject="Commande boutique";
      sessionMessage=`Bonjour, je souhaite ${p.statut==="precommande"?"précommander":"commander"} « ${p.titre} » : ${o.label.toLowerCase()} (${money(o.price)}, livraison incluse).\n\nAdresse de livraison :\nTéléphone :`;
    });
    sync();
  });
}

/* ---------- commande et paiement (mode en ligne) ---------- */
function openCheckout(p,o){
  const dlg=document.getElementById("checkout");
  dlg.innerHTML=`<form class="co" id="coForm" novalidate>
    <div class="co-head"><div><p class="eyebrow">Commande</p><h2>${esc(p.titre)}</h2><p class="sub">${esc(o.label)} · ${esc(o.detail||"")}</p></div><button type="button" class="copy" id="coClose">Fermer</button></div>
    <ol class="co-steps" aria-label="Étapes"><li class="on">1 · Coordonnées</li><li>2 · Paiement</li><li>3 · Confirmation</li></ol>
    <div class="field"><label for="co-zone">Livraison</label><select id="co-zone" name="zone">${ZONES().map(z=>`<option value="${esc(z.code)}">${esc(z.nom)}${+z[o.key]?` (+${money(z[o.key])})`:" (incluse)"}</option>`).join("")}</select></div>
    <dl class="co-lines"><div><dt>${esc(o.label)}</dt><dd>${money(o.price)}</dd></div><div><dt id="coShipL">Livraison à domicile</dt><dd id="coShip">Incluse</dd></div></dl>
    <div class="co-total"><span>Total</span><b id="coTot">${money(o.price)}</b></div>
    <div class="row2"><div class="field"><label for="co-nom">Nom complet</label><input id="co-nom" name="nom" autocomplete="name" required></div>
    <div class="field"><label for="co-tel">Téléphone</label><input id="co-tel" name="tel" type="tel" autocomplete="tel" required></div></div>
    <div class="field"><label for="co-email">E-mail (pour le bon de commande et le suivi)</label><input id="co-email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="co-adresse">Adresse de livraison</label><input id="co-adresse" name="adresse" autocomplete="street-address" required placeholder="Rue, numéro, appartement, étage"></div>
    <div class="row2"><div class="field"><label for="co-ville">Ville</label><input id="co-ville" name="ville" autocomplete="address-level2" required></div>
    <div class="field"><label for="co-cp">Code postal</label><input id="co-cp" name="code_postal" autocomplete="postal-code"></div></div>
    <div class="field" id="coPaysF" hidden><label for="co-pays">Pays</label><input id="co-pays" name="pays" autocomplete="country-name"></div>
    <div class="field"><label for="co-note">Note (facultatif)</label><textarea id="co-note" name="note" rows="2" style="min-height:64px" placeholder="Code d'entrée, disponibilités…"></textarea></div>
    <input type="text" name="site" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
    <p class="form-note" id="coDelai">Préparée à l'atelier sous ${esc(B.delai||"5 à 7 jours")}, puis livrée à domicile. Vous recevez un bon de commande par e-mail et un lien pour suivre votre commande.</p>
    <div class="co-secure">
      <div class="l">${ICO.lock}<p><b>Paiement 100 % sécurisé par Grow</b>, prestataire de paiement israélien. Vous saisissez votre carte uniquement sur la page Grow, à l'enseigne « עמנואל אלימי ארט » : aucune donnée bancaire ne passe par ce site.</p></div>
      ${PAYM}
    </div>
    <div id="coPay" class="co-pay"><button class="btn" type="submit" id="coGo" style="width:100%">Payer <span id="coGoSum">${money(o.price)}</span> ${ICO.lock}</button></div>
    <p class="ok" id="coMsg" role="status" hidden></p>
  </form>`;
  dlg.showModal();
  document.getElementById("coClose").onclick=()=>dlg.close();
  const f=document.getElementById("coForm"), msg=document.getElementById("coMsg");
  const say=t=>{ msg.hidden=!t; msg.textContent=t||""; };
  const client=()=>{ const d=new FormData(f); return {nom:d.get("nom"),tel:d.get("tel"),email:d.get("email"),adresse:d.get("adresse"),ville:d.get("ville"),code_postal:d.get("code_postal"),pays:d.get("pays")||"",note:d.get("note")}; };
  const zSel=document.getElementById("co-zone"), paysF=document.getElementById("coPaysF"), pays=document.getElementById("co-pays");
  const zone=()=>ZONES().find(z=>z.code===zSel.value)||ZONES()[0];
  const syncZone=()=>{ const z=zone(), fee=+z[o.key]||0, il=z.code==="IL";
    document.getElementById("coShipL").textContent=il?"Livraison à domicile":`Livraison, ${z.nom}`;
    document.getElementById("coShip").textContent=fee?money(fee):"Incluse";
    document.getElementById("coTot").textContent=money(o.price+fee); document.getElementById("coGoSum").textContent=money(o.price+fee);
    paysF.hidden=il; pays.required=!il; if(!il && (!pays.value||pays.dataset.auto)){ pays.value=z.code==="FR"?"France":""; pays.dataset.auto=pays.value?"1":""; }
    document.getElementById("co-tel").previousElementSibling.textContent=il?"Téléphone":"Téléphone (avec indicatif)"; };
  pays.addEventListener("input",()=>{ pays.dataset.auto=""; });
  zSel.addEventListener("change",syncZone); syncZone();
  f.onsubmit=e=>{ e.preventDefault(); say("");
    if(!f.reportValidity()){ say("Merci de remplir vos coordonnées avant de payer."); return; }
    const go=document.getElementById("coGo"); go.disabled=true; go.firstChild.textContent="Ouverture du paiement… ";
    api("creer",{produit_id:p.id, option:o.key, zone:zone().code, client:client(), site:new FormData(f).get("site")})
      .then(r=>{ location.href=r.url; })
      .catch(e=>{ say(e.message); go.disabled=false; go.firstChild.textContent="Payer "; });
  };
}

/* ---------- suivi de commande (client) ---------- */
const STEPS=[["payee","Payée"],["en_preparation","En préparation"],["expediee","Expédiée"],["livree","Livrée"]];
function suiviPage(token){
  if (!document.getElementById("suiviBody")) suiviPage.n=0;
  setTimeout(()=>{
    api("suivi",{token}).then(c=>{
      if (c.statut==="en_attente"){
        const n=(suiviPage.n=(suiviPage.n||0)+1);
        document.getElementById("suiviNum").textContent=`Commande ${c.numero}`;
        document.getElementById("suiviBody").innerHTML = n<20
          ? `<p class="lede">Merci ! Nous attendons la confirmation de votre paiement, cela prend quelques secondes…</p>`
          : `<p class="lede">Le paiement n'est pas encore confirmé. Si vous avez été débité, vous recevrez le bon de commande par e-mail dans quelques minutes. Sinon, vous pouvez repasser commande depuis la boutique.</p>`;
        if (n<20 && location.hash==="#suivi/"+token) setTimeout(()=>{ if(location.hash==="#suivi/"+token) suiviPage(token); },3000);
        return;
      }
      const at=STEPS.findIndex(s=>s[0]===c.statut), when=s=>{ const h=(c.historique||[]).filter(x=>x.statut===s).pop(); return h?new Date(h.created_at).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}):""; };
      document.getElementById("suiviBody").innerHTML = (c.statut==="annulee" ? `<p class="lede">Cette commande a été annulée.</p>` :
        `<ol class="steps">${STEPS.map((s,i)=>`<li class="${i<=at?"done":""}${i===at?" now":""}"><b>${s[1]}</b><span>${when(s[0])}</span></li>`).join("")}</ol>`) +
        `<dl class="facts"><div><dt>Œuvre</dt><dd>${esc(c.produit)}</dd></div><div><dt>Option</dt><dd>${esc(c.option)}</dd></div><div><dt>Total</dt><dd>${money(c.prix)}${+c.frais_livraison?` (dont livraison ${money(c.frais_livraison)})`:""}</dd></div><div><dt>Livraison</dt><dd>À domicile, ${esc(c.ville)}${c.pays&&c.pays!=="Israël"?`, ${esc(c.pays)}`:""}</dd></div>
        ${c.transporteur||c.suivi_numero?`<div><dt>Colis</dt><dd>${esc(c.transporteur)} ${esc(c.suivi_numero)}${c.suivi_url?` · <a href="${esc(c.suivi_url)}" target="_blank" rel="noopener">suivre le colis</a>`:""}</dd></div>`:""}</dl>
        ${(c.historique||[]).filter(h=>h.message).map(h=>`<p class="note-msg"><span class="eyebrow">${esc(h.label)}</span>${esc(h.message)}</p>`).join("")}`;
      document.getElementById("suiviNum").textContent=`Commande ${c.numero}`;
    }).catch(e=>{ document.getElementById("suiviBody").innerHTML=`<p class="lede">${esc(e.message)} Vérifiez le lien reçu par e-mail, ou écrivez-nous.</p>`; });
  });
  return `<div class="wrap page-head reveal"><p class="eyebrow" id="suiviNum">Suivi de commande</p><h1>Ma commande<span class="heart">.</span></h1></div>
  <div class="wrap suivi" id="suiviBody"><p class="form-note">Chargement…</p></div>`;
}

/* ---------- rendering ---------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LB = [];

function workFig(list, i, code){
  const [id,title,w,h] = list[i];
  const ratio = (w&&h)?` width="${w}" height="${h}"`:"";
  const cat = code?`${code}-${String(i+1).padStart(2,"0")}`:"";
  return `<button class="work" data-i="${i}"><figure style="margin:0"><div class="frame"><img loading="lazy" src="${src(id,800)}"${ratio} alt="${esc(title||"Œuvre d'Emmanuel Alimi")}"></div>
  ${(title||cat)?`<figcaption><span>${esc(title)}</span><span class="cat">${cat}</span></figcaption>`:""}</figure></button>`;
}
function masonry(list, code){
  return `<div class="masonry" data-lb>${list.map((_,i)=>workFig(list,i,code)).join("")}</div>`;
}
function head(eyebrow, title, lede, crumb){
  return `<div class="wrap page-head reveal">${crumb?`<p class="eyebrow crumbs"><a href="#collections">Collections</a> / ${esc(crumb)}</p>`:`<p class="eyebrow">${esc(eyebrow)}</p>`}
  <h1>${title}</h1>${lede?`<p class="lede">${esc(lede)}</p>`:""}</div>`;
}
function collIndex(){
  return `<div class="colls">${COLLECTIONS.map(c=>`<a class="coll" href="#${c.slug}"><div class="frame"><img loading="lazy" src="${src(c.cover,800)}" alt="${esc(c.name)}"></div>
  <div class="meta"><h3>${esc(c.name)}</h3><span class="count">${String(c.works.length).padStart(2,"0")} œuvres</span></div></a>`).join("")}</div>`;
}

const ROUTES = {
  accueil(){
    return `<div class="wrap hero reveal">
      <h1>Offrez-vous<br>de l'art<em>.</em></h1>
      <div class="hero-row"><p class="lede">Peintre, portraitiste et caricaturiste. Œuvres originales, commandes personnalisées et live painting pour vos événements.</p>
      <a class="btn" href="#collections">Voir les œuvres</a></div>
      ${S.accueil?`<div class="hero-banner"><img src="${src(S.accueil,1600)}" alt="The LoveSpreader, Respire Collection"></div>`:""}
    </div>
    <section class="wrap"><div class="sec-head"><h2>Collections</h2><span class="eyebrow">${COLLECTIONS.length} séries</span></div>${collIndex()}</section>
    <section class="wrap"><div class="sec-head"><h2>À l'atelier</h2><span class="eyebrow">En cours</span></div>${masonry(ATELIER,"")}</section>
    <section class="wrap"><div class="sec-head"><h2>Événements</h2><a class="eyebrow" href="#evenements">Tout voir</a></div>${eventsGrid()}</section>
    ${contactBlock()}`;
  },
  collections(){ return head("Galerie","Collections",`${COLLECTIONS.length} séries, du trait noir de Respire aux portraits sur commande.`)+`<div class="wrap" style="padding-bottom:40px">${collIndex()}</div>`; },
  "graphic-design"(){ return head("Studio","Graphic design","Identités, affiches, pochettes et supports imprimés.")+`<div class="wrap">${masonry(GRAPHIC,"GRA")}</div>`; },
  evenements(){
    const p=EVENTS.painting;
    return head("Sur réservation","Événements","Caricature et peinture en direct pour vos fêtes. Pour réserver ou en savoir plus, écrivez-nous.")+
    `<div class="wrap">${eventsGrid()}</div>
    <section class="wrap"><div class="sec-head"><h2>Live painting</h2><span class="eyebrow">En images</span></div>${masonry(p.gallery,"")}</section>
    <div class="wrap"><a class="btn" href="#contact" data-subject="Réservation événement">Réserver une date</a></div>`;
  },
  boutique(){
    if (liveState==="loading") return head("Boutique", `${esc(B.titre||"Prints")}<span class="heart">.</span>`, B.intro||"")+`<div class="wrap"><p class="form-note">Chargement des prints…</p></div>`;
    const list = SHOP();
    if (!list.length) return `<div class="wrap soon reveal"><p class="eyebrow">Boutique</p><h1>Coming<br>soon<span class="heart">.</span></h1>
    <p class="lede">La boutique en ligne arrive bientôt. En attendant, pour une œuvre ou une commande personnalisée, écrivez-nous.</p>
    <a class="btn" href="#contact" data-subject="Boutique">Nous écrire</a></div>`;
    const delai = B.delai||"5 à 7 jours", intl = ZONES().length>1;
    const trust = LIVE ? `<ul class="trust">
        <li>${ICO.lock}<div><b>Paiement sécurisé</b><span>Carte, Bit, Apple Pay ou Google Pay, via Grow.</span></div></li>
        <li>${ICO.truck}<div><b>Livraison incluse en Israël</b><span>À domicile.${intl?" Envoi à l'étranger possible.":""}</span></div></li>
        <li>${ICO.brush}<div><b>Préparé à la main</b><span>Imprimé et encadré à l'atelier sous ${esc(delai)}.</span></div></li>
        <li>${ICO.track}<div><b>Suivi de commande</b><span>Bon de commande par e-mail et suivi en ligne.</span></div></li>
      </ul>` : (B.points||[]).length?`<ul class="tags shop-tags">${B.points.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:"";
    const faq = [
      ["Quand vais-je recevoir mon print ?", `Chaque print est préparé à l'atelier sous ${delai}, puis livré à votre domicile. Vous recevez un e-mail à chaque étape (en préparation, expédié) et vous pouvez suivre votre commande en ligne à tout moment.`],
      ["Livrez-vous hors d'Israël ?", intl ? `Oui : en France, aux États-Unis et au Canada, et dans le reste du monde. Le supplément de livraison s'affiche avant le paiement, vous connaissez le prix total avant de payer.` : `Pour un envoi hors d'Israël, écrivez-nous avant de commander.`],
      ["Le paiement est-il sécurisé ?", `Oui. Le paiement se fait sur la page sécurisée de Grow, prestataire de paiement israélien, à l'enseigne « עמנואל אלימי ארט ». Vos données bancaires ne passent jamais par ce site. Carte bancaire, Bit, Apple Pay et Google Pay sont acceptés.`],
      ["Mon colis arrive abîmé, que faire ?", `Écrivez-nous dès réception, avec une photo du colis et du print. Nous vous proposons un remplacement ou un remboursement.`],
      ["J'ai une question avant de commander.", `Écrivez-nous à ${EMAIL} ou sur Instagram @alimi_art. Réponse sous 48 h.`],
    ];
    return head("Boutique", `${esc(B.titre||"Prints")}<span class="heart">.</span>`, B.intro||"")+
    `<div class="wrap">${trust}
      <div class="prints">${list.map(printCard).join("")}</div></div>
    ${LIVE?`<section class="wrap"><div class="sec-head"><h2>Comment ça marche</h2><span class="eyebrow">4 étapes</span></div>
      <ol class="how"><li><b>Choisissez</b><span>Le print et l'option : print seul ou encadré.</span></li>
      <li><b>Payez en sécurité</b><span>Sur la page Grow : carte, Bit, Apple Pay ou Google Pay. Bon de commande par e-mail.</span></li>
      <li><b>On prépare</b><span>Impression, signature et encadrement à l'atelier, sous ${esc(delai)}.</span></li>
      <li><b>Vous recevez</b><span>Livraison à domicile, suivie en ligne jusqu'à votre porte.</span></li></ol></section>`:""}
    <section class="wrap"><div class="sec-head"><h2>Œuvres originales</h2><span class="eyebrow">Sur demande</span></div>
      <div class="split" style="align-items:start"><p class="lede" style="margin:0">${esc(B.originaux||"")}</p>
      <div><a class="btn" href="#contact" data-subject="Acquisition d'une œuvre">Acquérir une œuvre</a></div></div></section>
    ${LIVE?`<section class="wrap"><div class="sec-head"><h2>Questions fréquentes</h2></div>
      <div class="faq">${faq.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div>
      <div class="ask" style="margin-top:clamp(24px,4vw,40px)"><p><span class="eyebrow">Une question ?</span>Emmanuel vous répond personnellement, sous 48 h.</p>
      <a class="btn ghost" href="#contact" data-subject="Commande boutique">Nous écrire</a></div></section>`
    :(B.infos||[]).length?`<section class="wrap" style="padding-top:0"><div class="shop-info">${B.infos.map(x=>`<div><h3>${esc(x.titre)}</h3><p>${esc(x.texte)}</p></div>`).join("")}</div></section>`:""}`;
  },
  alimi(){
    return head("Biographie","Qui est Alimi ?","")+`<div class="wrap"><div class="bio">
      <img class="portrait" src="${src(S.portrait,1200)}" alt="Emmanuel Alimi">
      <div><p>Né en France en 1995, Emmanuel quitte son pays natal pour sa Terre Promise, avec une promesse en tête : réussir à partager et faire découvrir son art.</p>
      <p>Artiste coincé dans le corps d'un informaticien, son talent explose à l'âge de 13 ans, où il commence à peindre les petites voix dans sa tête, de Ray Charles à Robert De Niro en passant par Bob Dylan.</p>
      <p>La Pop Culture restant une influence évidente pour Alimi, il décide de s'en détacher et de créer pour créer, une sorte d'échappatoire pour un cerveau en ébullition.</p>
      <p>Aujourd'hui caricaturiste en herbe, expert portraitiste, futur premier ministre (ou futur Mark Zuckerberg), le fils de Superman décide de passer à l'action et de réaliser de grandes œuvres pour VOUS seulement !</p>
      <blockquote style="margin-top:36px">« L'art est un anti-destin. »<cite>André Malraux</cite></blockquote>
      <p style="margin-top:28px">Et maintenant, l'art est accessible à tous. Shalom !</p></div></div></div>`;
  },
  contact(){ return contactBlock(true); }
};

function eventsGrid(){
  return `<div class="events">${Object.values(EVENTS).map(e=>`<a class="event" href="#contact" data-subject="Réservation : ${esc(e.name)}"><div class="frame"><img loading="lazy" src="${src(e.img,800)}" alt="${esc(e.name)}"></div>
  <h3>${esc(e.name)}</h3><p style="margin:0;color:var(--muted)">${esc(e.text)}</p><ul class="tags">${e.tags.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></a>`).join("")}</div>`;
}
function contactBlock(full){
  return `<section class="wrap" id="contact-sec"><div class="contact">
   <div class="contact-head"><p class="eyebrow">Commandes, tarifs, événements</p><h2 style="margin-top:12px">Contact<span class="heart">♥</span></h2></div>
   <div><p class="lede" style="margin-top:0">Vous désirez passer une commande personnalisée ou connaître les tarifs ? Écrivez-nous, réponse sous 48 h.</p>
     <div class="mail-row"><span class="mail" id="mailtxt">${EMAIL}</span><button class="copy" id="copyMail" type="button">Copier</button></div>
     <div class="socials"><a href="https://www.instagram.com/alimi_art/" target="_blank" rel="noopener">Instagram @alimi_art</a><a href="https://www.facebook.com/alimiarts" target="_blank" rel="noopener">Facebook</a></div></div>
   <form id="cform" novalidate>
     <div class="row2"><div class="field"><label for="f-name">Nom</label><input id="f-name" name="name" autocomplete="name" required></div>
     <div class="field"><label for="f-mail">E-mail</label><input id="f-mail" name="email" type="email" autocomplete="email" required></div></div>
     <div class="field"><label for="f-subj">Objet</label><select id="f-subj" name="subject">
       <option>Commande personnalisée</option><option>Portrait</option><option>Réservation événement</option><option>Commande boutique</option><option>Acquisition d'une œuvre</option><option>Autre</option></select></div>
     <div class="field"><label for="f-msg">Message</label><textarea id="f-msg" name="message" required></textarea></div>
     <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
     <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><button class="btn" type="submit" id="fsend">Envoyer</button><span class="ok" id="fok" role="status" hidden></span></div>
     <p class="form-note">Votre message nous parvient directement. Réponse sous 48 h, à l'adresse e-mail indiquée.</p>
   </form></div></section>`;
}

function render(){
  const route = (location.hash.slice(1)||"accueil");
  const coll = COLLECTIONS.find(c=>c.slug===route);
  let html;
  if (coll){
    html = head("","" ,"",coll.name).replace("<h1></h1>",`<h1>${esc(coll.name)}</h1><p class="lede">${esc(coll.intro)}</p>`);
    if (coll.banners && coll.banners.length) html += `<div class="wrap"><div class="wide-strip" data-lb>${coll.banners.slice(0,3).map((b,i)=>`<button class="work" data-i="${i}"><div class="frame"><img loading="lazy" src="${src(b[0],1600)}" alt="${esc(b[1])}"></div><figcaption><span>${esc(b[1])}</span><span class="cat">Bannière</span></figcaption></button>`).join("")}</div></div>`;
    html += `<div class="wrap">${masonry(coll.works, coll.code)}</div>`;
    const others = COLLECTIONS.filter(c=>c!==coll);
    html += `<section class="wrap"><div class="sec-head"><h2>Autres séries</h2></div><div class="colls">${others.map(c=>`<a class="coll" href="#${c.slug}"><div class="frame"><img loading="lazy" src="${src(c.cover,800)}" alt="${esc(c.name)}"></div><div class="meta"><h3>${esc(c.name)}</h3><span class="count">${String(c.works.length).padStart(2,"0")} œuvres</span></div></a>`).join("")}</div></section>`;
    LBSRC = {lists:[coll.banners?coll.banners.slice(0,3).map(b=>[b[0],b[1]]):null, coll.works]};
  } else {
    html = route.startsWith("suivi/") && LIVE ? suiviPage(route.slice(6)) : (ROUTES[route]||ROUTES.accueil)();
  }
  app.innerHTML = html;
  document.querySelectorAll(".nav a").forEach(a=>{
    const h=a.getAttribute("href").slice(1);
    const on = h===route || (h==="collections" && !!coll);
    on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current");
  });
  document.getElementById("nav").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  wire(route, coll);
  const pend = sessionSubject; if (pend){ const s=document.getElementById("f-subj"); if(s){ const o=[...s.options].find(o=>o.text===pend)||new Option(pend,pend,true,true); if(!o.parentNode) s.add(o); s.value=o.value; } sessionSubject=null; }
  if (sessionMessage){ const m=document.getElementById("f-msg"); if(m) m.value=sessionMessage; sessionMessage=null; }
  if (!scrollToContact) window.scrollTo({top:0});
  else { document.getElementById("contact-sec")?.scrollIntoView(); scrollToContact=false; }
}
let LBSRC=null, sessionSubject=null, sessionMessage=null, scrollToContact=false;

function wire(route, coll){
  // lightbox groups: each [data-lb] container is its own sequence
  document.querySelectorAll("[data-lb]").forEach(group=>{
    const items=[...group.querySelectorAll(".work")].map(b=>{const im=b.querySelector("img");return {src:im.currentSrc||im.src, alt:im.alt, cap:b.querySelector("figcaption span")?.textContent||""};});
    group.querySelectorAll(".work").forEach((b,i)=>b.addEventListener("click",()=>openLB(items.map(x=>({...x,src:x.src.replace(/-800\.webp$/,"-1600.webp")})),i)));
  });
  document.querySelectorAll("[data-subject]").forEach(a=>a.addEventListener("click",()=>{sessionSubject=a.dataset.subject; sessionMessage=a.dataset.msg||null;}));
  if (route==="boutique") wireShop();
  const copy=document.getElementById("copyMail");
  if (copy) copy.addEventListener("click",()=>{
    const done=()=>{copy.textContent="Copié";setTimeout(()=>copy.textContent="Copier",1600);};
    try{ navigator.clipboard.writeText(EMAIL).then(done,()=>selectMail()); }catch(e){ selectMail(); }
  });
  const f=document.getElementById("cform");
  if (f) f.addEventListener("submit",e=>{
    e.preventDefault();
    const ok=document.getElementById("fok");
    if(!f.reportValidity()) return;
    const d=new FormData(f);
    const btn=document.getElementById("fsend");
    d.append("access_key",FORM_KEY);
    d.set("subject",`${d.get("subject")} : message de ${d.get("name")} (emmanuelalimi.com)`);
    d.append("from_name","Site emmanuelalimi.com");
    d.append("replyto",d.get("email"));
    btn.disabled=true; btn.textContent="Envoi…"; ok.hidden=true;
    fetch("https://api.web3forms.com/submit",{method:"POST",body:d,headers:{Accept:"application/json"}})
      .then(r=>r.json()).then(j=>{
        if(!j.success) throw new Error(j.message||"erreur");
        f.reset(); ok.hidden=false; ok.textContent="Merci, votre message est bien envoyé. Réponse sous 48 h.";
      }).catch(()=>{
        ok.hidden=false; ok.textContent=`L'envoi n'a pas abouti. Écrivez-nous directement à ${EMAIL}.`;
      }).finally(()=>{ btn.disabled=false; btn.textContent="Envoyer"; });
  });
}
function selectMail(){const r=document.createRange();r.selectNodeContents(document.getElementById("mailtxt"));const s=getSelection();s.removeAllRanges();s.addRange(r);}

/* lightbox */
const lb=document.getElementById("lb"), lbImg=document.getElementById("lbImg");
let cur=[], idx=0, lastFocus=null;
function openLB(list,i){ cur=list; idx=i; lastFocus=document.activeElement; lb.hidden=false; document.body.style.overflow="hidden"; show(); document.getElementById("lbClose").focus(); }
function show(){ const it=cur[idx]; lbImg.src=it.src; lbImg.alt=it.alt; document.getElementById("lbTitle").textContent=it.cap||""; document.getElementById("lbCount").textContent=`${String(idx+1).padStart(2,"0")} / ${String(cur.length).padStart(2,"0")}`; }
function closeLB(){ lb.hidden=true; document.body.style.overflow=""; lastFocus&&lastFocus.focus(); }
document.getElementById("lbClose").onclick=closeLB;
document.getElementById("lbPrev").onclick=()=>{idx=(idx-1+cur.length)%cur.length;show();};
document.getElementById("lbNext").onclick=()=>{idx=(idx+1)%cur.length;show();};
lb.addEventListener("click",e=>{ if(e.target===lb||e.target.classList.contains("lb-stage")) closeLB(); });
document.addEventListener("keydown",e=>{ if(lb.hidden) return; if(e.key==="Escape")closeLB(); if(e.key==="ArrowLeft")document.getElementById("lbPrev").click(); if(e.key==="ArrowRight")document.getElementById("lbNext").click(); });
let tx=null; lb.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
lb.addEventListener("touchend",e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50)(dx<0?document.getElementById("lbNext"):document.getElementById("lbPrev")).click(); tx=null; });

/* menu, routing */
document.getElementById("menuBtn").onclick=e=>{ const n=document.getElementById("nav"); n.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded",n.classList.contains("open")); };
if (LOGO) document.getElementById("sigimg").src=src(LOGO,200);
document.getElementById("yr").textContent=new Date().getFullYear();
window.addEventListener("hashchange",()=>{ if(location.hash==="#contact" && sessionSubject && document.getElementById("cform")){ scrollToContact=true; } render(); });
render();
</script>
</body>
</html>
